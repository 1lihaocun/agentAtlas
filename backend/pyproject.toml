[project]
name = "agentatlas"
version = "0.2.0"
description = "本地智能体文件管理与检索"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "markdown-it-py>=3,<5",
  "python-frontmatter>=1.1,<2",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "portalocker>=3,<4",
]

[project.scripts]
atlas = "atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F821", "F822", "F823"]
